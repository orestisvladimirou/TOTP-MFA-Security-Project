name: Local prototype regression tests

# Temporarily manual-only while GitHub Actions minutes are exhausted.
# Local tests: python -m unittest discover -s tests -v
on:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install direct dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run portfolio regression suite
        run: python -m unittest discover -s tests -v
